apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-symptom-service
  namespace: healthcare
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-symptom-service
  template:
    metadata:
      labels:
        app: ai-symptom-service
    spec:
      containers:
        - name: ai-symptom-service
          image: ai-symptom-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8089
          env:
            - name: PORT
              value: "8089"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8089
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ai-symptom-service
  namespace: healthcare
spec:
  type: ClusterIP
  selector:
    app: ai-symptom-service
  ports:
    - protocol: TCP
      port: 8089
      targetPort: 8089
      name: http
