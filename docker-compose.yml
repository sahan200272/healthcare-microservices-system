version: '3.8'

services:

  api-gateway:
    build: ./healthcare-platform/services/api-gateway
    ports:
      - "8080:8080"
    environment:
      - JWT_SECRET=${JWT_SECRET}
    depends_on: # Ensures these services start before gateway
      - auth-service
      - telemedicine-service

  auth-service:
    build: ./healthcare-platform/services/auth-service
    ports:
      - "8085:8085"
    environment:
      - MONGO_URI=${MONGO_URI_AUTH}
      - JWT_SECRET=${JWT_SECRET}

  telemedicine-service:
    build: ./healthcare-platform/services/telemedicine-service
    ports:
      - "8087:8087"
    environment:
      - MONGO_URI=${MONGO_URI_TELEMEDICINE}
      - JWT_SECRET=${JWT_SECRET}