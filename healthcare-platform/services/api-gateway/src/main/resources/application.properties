spring.application.name=api-gateway
server.port=8080

jwt.secret=${JWT_SECRET}
spring.cloud.gateway.default-filters[0]=RemoveRequestHeader=Cookie
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Auth Service - public
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=${AUTH_SERVICE_URL:http://localhost:8088}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

# Telemedicine Service - not public
spring.cloud.gateway.routes[1].id=telemedicine-service
spring.cloud.gateway.routes[1].uri=${TELEMEDICINE_SERVICE_URL:http://localhost:8087}
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/sessions/**

# Patient Service
spring.cloud.gateway.routes[2].id=patient-service
spring.cloud.gateway.routes[2].uri=${PATIENT_SERVICE_URL:http://localhost:8085}
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/patients/**

# Doctor Service
spring.cloud.gateway.routes[3].id=doctor-service
spring.cloud.gateway.routes[3].uri=${DOCTOR_SERVICE_URL:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/doctors/**

# Appointment Service
spring.cloud.gateway.routes[4].id=appointment-service
spring.cloud.gateway.routes[4].uri=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/appointments/**

# AI Symptom Service
# Frontend calls  POST /api/ai/symptom-checker
# Controller sits at               POST /api/symptoms/analyze
# RewritePath uses Java regex: the capture group /(?<segment>.*) strips the /api/ai/ prefix
# and replaces it with /api/symptoms/ so the downstream controller is hit correctly.
spring.cloud.gateway.routes[5].id=ai-symptom-service
spring.cloud.gateway.routes[5].uri=${AI_SYMPTOM_SERVICE_URL:http://localhost:8081}
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/ai/symptom-checker
spring.cloud.gateway.routes[5].filters[0]=RewritePath=/api/ai/symptom-checker, /api/symptoms/analyze

# Payment Service
spring.cloud.gateway.routes[6].id=payment-service
spring.cloud.gateway.routes[6].uri=${PAYMENT_SERVICE_URL:http://localhost:8086}
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/payments/**

# Global CORS configuration
# Explicitly list the frontend origin so allowCredentials=true is safe (wildcard + credentials is rejected by browsers)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS,PATCH,HEAD
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=Authorization,Content-Type,X-Requested-With,Accept,Origin
spring.cloud.gateway.globalcors.cors-configurations.[/**].exposedHeaders=Authorization
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowCredentials=true
spring.cloud.gateway.globalcors.cors-configurations.[/**].maxAge=3600

# HTTP client timeouts — prevents 502 when AI/external calls are slow
# Gemini can take up to 30 s; give it 35 s total response window
spring.cloud.gateway.httpclient.connect-timeout=5000
spring.cloud.gateway.httpclient.response-timeout=35s

