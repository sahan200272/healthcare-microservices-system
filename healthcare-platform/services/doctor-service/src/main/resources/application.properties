spring.application.name=doctor-service

# MongoDB
spring.mongodb.uri=${MONGO_URI}

# Server
server.port=${PORT:8083}

# JWT — must match the secret used in auth-service to sign tokens
jwt.secret=${JWT_SECRET}

# Inter-service base URLs
# Local: set APPOINTMENT_SERVICE_URL=http://localhost:8082
# Docker: set APPOINTMENT_SERVICE_URL=http://appointment-service:8082
services.appointment.base-url=${APPOINTMENT_SERVICE_URL:http://localhost:8082}
services.patient.base-url=${PATIENT_SERVICE_URL:http://localhost:8081}

# Simulation flags — set true to demo without other services running
services.patient.simulate=${PATIENT_SIMULATE:false}
