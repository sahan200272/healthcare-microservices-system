spring.application.name=ai-symptom-service
server.port=${PORT:8089}

jwt.secret=${JWT_SECRET}
gemini.api.key=${GEMINI_API_KEY}

# Gemini model to use for generateContent.
# Current stable GA model as of April 2025 (see https://ai.google.dev/gemini-api/docs/models).
# Swap this without touching Java code -- e.g. gemini-2.5-pro, gemini-flash-latest
gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# ── Retry settings (tunable per-environment) ──────────────────────────────────
# Attempts 1 + 3 retries = 4 total calls maximum, backoff: 1s → 2s → 4s
gemini.retry.max-attempts=${GEMINI_RETRY_MAX_ATTEMPTS:3}
gemini.retry.initial-backoff-seconds=${GEMINI_RETRY_BACKOFF_SECONDS:1}

# ── Resilience4j circuit breaker ──────────────────────────────────────────────
# Instance name must match @CircuitBreaker(name = "gemini") in SymptomAnalysisService
resilience4j.circuitbreaker.instances.gemini.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.gemini.sliding-window-size=10
resilience4j.circuitbreaker.instances.gemini.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gemini.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.gemini.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.gemini.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.gemini.record-exceptions=\
  com.healthcare.ai_symptom_service.exception.GeminiServiceException,\
  java.util.concurrent.TimeoutException,\
  java.io.IOException

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.org.springframework.web=INFO
logging.level.com.healthcare.ai_symptom_service=INFO
logging.level.org.springframework.web.reactive.function.client=INFO
logging.level.io.github.resilience4j=INFO
