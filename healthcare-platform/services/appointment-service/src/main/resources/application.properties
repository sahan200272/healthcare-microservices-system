# App
spring.application.name=appointment-service

# MongoDB
spring.mongodb.uri=${MONGO_URI}

# Server
server.port=${PORT:8082}

# JWT
jwt.secret=${JWT_SECRET}

# Doctor Service
clients.doctor-service.base-url=${DOCTOR_SERVICE_URL:http://doctor-service:8083}

# Notification Service
clients.notification-service.base-url=${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
clients.notification-service.mock-enabled=${NOTIFICATION_SERVICE_MOCK_ENABLED:true}

# Logging Configuration
logging.level.root=INFO
logging.level.com.healthcare.appointment_service=DEBUG
logging.pattern.console=%d{ISO8601} %highlight(%-5level) %logger{36} - %msg%n
